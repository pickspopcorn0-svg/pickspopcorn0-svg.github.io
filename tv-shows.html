<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Movies — Popcorn Picks</title>

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0c">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="preconnect" href="https://pagead2.googlesyndication.com">
<link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6052420824639800"
        crossorigin="anonymous"></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0b0b0c;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    text-rendering:optimizeLegibility;
  }
  a{text-decoration:none;color:inherit}
  button,input{font:inherit}
  a,button,.card{-webkit-tap-highlight-color:transparent}
  input,button{touch-action:manipulation}
  :focus-visible{outline:2px solid rgba(255,255,255,.22);outline-offset:2px;border-radius:12px}

  /* ===== TOP BAR ===== */
  .top{
    position:sticky; top:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:rgba(10,10,10,.88);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #222;
    z-index:50;
  }
  .top b{font-size:16px;letter-spacing:.2px}

  .navLeft{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    max-width:62%;
  }
  .navBtn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.03);
    color:#ddd;
    font-size:13px;
    line-height:1;
    white-space:nowrap;
    user-select:none;
  }
  .navBtn:active{transform:translateY(1px)}

  /* ===== LAYOUT ===== */
  .wrap{padding:18px 18px 8px}
  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search{
    flex:1;
    min-width:240px;
    display:flex;
    gap:10px;
  }
  .search input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid #222;
    background:#111;
    color:#fff;
    outline:none;
  }
  .btn{
    padding:12px 14px;
    border-radius:12px;
    border:1px solid #222;
    background:#141414;
    color:#fff;
    cursor:pointer;
    user-select:none;
  }
  .btn:active{transform:translateY(1px)}
  .small{
    color:#aaa;
    font-size:12px;
    padding:10px 2px 0;
    line-height:1.4;
  }

  .chips{
    margin-top:12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid #222;
    background:#111;
    color:#ddd;
    padding:10px 12px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .chip.on{
    border-color:#444;
    background:#1b1b1b;
    color:#fff;
  }

  .grid{
    padding:16px 18px 26px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
  }

  /* ===== CARD ===== */
  .card{
    border-radius:18px;
    border:1px solid #181818;
    overflow:hidden;
    position:relative;
    background:#111;
    min-height:320px;
    cursor:pointer;
    user-select:none;
    transform:translateZ(0);
  }
  @media(hover:hover){
    .card:hover{border-color:#262626;transform:translateY(-1px)}
  }

  .poster{
    height:320px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .poster img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;          /* grid looks cinematic */
    object-position:center;
  }
  .poster.fallback{
    background:
      radial-gradient(700px 380px at 20% 15%, rgba(255,255,255,.09), transparent 55%),
      linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.8));
  }

  .info{
    position:absolute;
    bottom:0;left:0;right:0;
    padding:14px;
    background:linear-gradient(to top,rgba(0,0,0,.92),transparent);
  }
  .title{font-size:18px;font-weight:650;line-height:1.2}
  .meta{font-size:12px;color:#aaa;margin-top:4px}
  .tagsline{
    font-size:12px;
    color:#cfcfcf;
    margin-top:8px;
    opacity:.9;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .empty{
    padding:22px 18px 30px;
    color:#aaa;
    display:none;
  }

  /* ===== MODAL ===== */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:999;
    overscroll-behavior:contain;
  }
  .modal.on{display:flex}

  .sheet{
    width:min(980px, 100%);
    max-height:calc(100dvh - 36px);
    border:1px solid #1f1f1f;
    background:#0f0f0f;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .sheetTop{
    position:sticky; top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 14px;
    border-bottom:1px solid #1f1f1f;
    background:#0d0d0d;
    z-index:5;
    flex:0 0 auto;
  }
  .closeBtn{
    border:1px solid #222;
    background:#141414;
    color:#fff;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    user-select:none;
  }

  .sheetBody{
    padding:16px;
    display:grid;
    grid-template-columns:320px 1fr;
    gap:16px;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    flex:1 1 auto;
  }

  /* Modal poster: contain (no head cut) + tap to zoom */
  .bigPoster{
    height:460px;
    border-radius:16px;
    border:1px solid #1b1b1b;
    background:#111;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bigPoster img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;        /* full poster visible */
    object-position:center;
    transform:translateZ(0);
  }
  .bigPoster.fallback{
    background:
      radial-gradient(900px 520px at 20% 15%, rgba(255,255,255,.09), transparent 55%),
      linear-gradient(to bottom, rgba(0,0,0,.12), rgba(0,0,0,.85));
  }
  .bigPoster.zoomed img{
    transform:scale(1.8);
    transform-origin:center;
  }
  @media(hover:hover){
    .bigPoster img{cursor:zoom-in}
    .bigPoster.zoomed img{cursor:zoom-out}
  }

  .h1{font-size:26px;font-weight:750;line-height:1.1}
  .muted{color:#aaa;font-size:13px;line-height:1.5;margin-top:8px}
  .why{margin-top:14px;font-size:14px;line-height:1.8;color:#ddd;white-space:pre-line}
  .pills{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .pill{
    font-size:12px;
    border:1px solid #222;
    background:#111;
    padding:8px 10px;
    border-radius:999px;
    color:#d8d8d8;
  }

  @media(max-width:900px){
    .sheetBody{grid-template-columns:1fr}
    .bigPoster{height:420px}
  }
  @media(max-width:480px){
    .top{padding:12px 14px}
    .top b{font-size:14px}
    .navBtn{padding:8px 10px;font-size:12px}
    .grid{padding:14px 14px 24px;gap:14px}
    .wrap{padding:16px 14px 8px}
    .poster{height:340px}
  }

  /* iOS strong scroll lock (prevents background scroll & jump) */
  body.modalOpen{
    overflow:hidden;
    position:fixed;
    width:100%;
  }
</style>
</head>

<body>

<div class="top">
  <div class="navLeft">
    <a class="navBtn" href="categories.html">← Categories</a>
    <a class="navBtn" href="index.html">Home</a>
  </div>
  <b>Movies</b>
  <span></span>
</div>

<div class="wrap">
  <div class="controls">
    <div class="search">
      <input id="q" type="text" placeholder="Search title, year, genre, country, vibe..." autocomplete="off" />
      <button class="btn" id="clearBtn" type="button">Clear</button>
    </div>
    <button class="btn" id="clearFiltersBtn" type="button">Clear filters</button>
  </div>

  <div class="small" id="resultCount">Loading...</div>
  <div class="chips" id="chips"></div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty">No matches. Try removing filters or changing the search.</div>

<!-- MODAL -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Movie details">
    <div class="sheetTop">
      <div style="font-weight:700">Details</div>
      <button class="closeBtn" id="closeBtn" type="button">Close</button>
    </div>
    <div class="sheetBody" id="sheetBody">
      <div class="bigPoster fallback" id="mPoster"></div>
      <div>
        <div class="h1" id="mTitle">—</div>
        <div class="muted" id="mMeta"></div>
        <div class="pills" id="mPills"></div>
        <div class="why" id="mWhy"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================
   MOVIES DATA (EDIT HERE)
   =========================
   - Put posters in: assets/posters/movies/
   - If no poster yet: poster: "" (fallback)
*/
const MOVIES = [
  {
    id:"decision-to-leave-2022",
    title:"Decision to Leave",
    year:"2022",
    meta:"South Korea • Park Chan-wook",
    genres:["Romance","Mystery","Thriller","Neo-noir","South Korea"],
    poster:"assets/posters/movies/decision-to-leave-2022.jpg",
    summary:`A meticulous detective investigating a suspicious death becomes emotionally entangled with the victim’s widow. Love and suspicion twist together until the case turns into a tragic noir about desire as evidence.`
  },
  {
    id:"burning-2018",
    title:"Burning",
    year:"2018",
    meta:"South Korea • Lee Chang-dong",
    genres:["Mystery","Drama","Psychological","Slow-burn","South Korea"],
    poster:"assets/posters/movies/burning-2018.jpg",
    summary:`A quiet young man is pulled into a tense triangle of class, jealousy, and obsession. The mystery grows slowly—until absence itself becomes terrifying.`
  },
  {
    id:"shoplifters-2018",
    title:"Shoplifters",
    year:"2018",
    meta:"Japan • Hirokazu Kore-eda",
    genres:["Drama","Japan"],
    poster:"assets/posters/movies/shoplifters-2018.jpg",
    summary:`A fragile found-family survives on small thefts and shared care—until the outside world forces a brutal question: what really makes a family?`
  },
  {
    id:"parasite-2019",
    title:"Parasite",
    year:"2019",
    meta:"South Korea • Bong Joon-ho",
    genres:["Thriller","Drama","Dark Comedy","South Korea"],
    poster:"assets/posters/movies/parasite-2019.jpg",
    summary:`A poor family infiltrates a rich household. What starts as clever satire turns darker—exposing the violence beneath comfort and class.`
  }
];

/* =========================
   APP LOGIC (DON'T EDIT)
   ========================= */
const $ = (id) => document.getElementById(id);

const grid = $("grid");
const chipsEl = $("chips");
const qEl = $("q");
const clearBtn = $("clearBtn");
const clearFiltersBtn = $("clearFiltersBtn");
const resultCount = $("resultCount");
const emptyEl = $("empty");

const modal = $("modal");
const closeBtn = $("closeBtn");
const sheetBody = $("sheetBody");

const mPoster = $("mPoster");
const mTitle = $("mTitle");
const mMeta  = $("mMeta");
const mPills = $("mPills");
const mWhy   = $("mWhy");

const picked = new Set();
let scrollY = 0;

function normalize(s){ return String(s || "").toLowerCase().trim(); }

function buildChips(items){
  const counts = new Map();
  items.forEach(m=>{
    (m.genres || []).forEach(t=>{
      const tag = String(t).trim();
      if(!tag) return;
      counts.set(tag, (counts.get(tag) || 0) + 1);
    });
  });

  const priority = [
    "India","South Korea","Japan","China","Hong Kong","France","Poland","Brazil","Iran","USA","Canada","UK",
    "Action","Crime","Thriller","Mystery","Drama","Horror","Sci-Fi","War","Historical","Romance",
    "Neo-noir","Slow-burn","Psychological","Atmospheric","Stylish","Investigation","Survival"
  ];

  const present = new Set([...counts.keys()]);
  const first = priority.filter(t => present.has(t));

  const rest = [...counts.entries()]
    .filter(([t]) => !priority.includes(t))
    .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]))
    .map(([t])=>t);

  return [...first, ...rest].slice(0, 40);
}

function chipButton(tag){
  const b = document.createElement("div");
  b.className = "chip" + (picked.has(tag) ? " on" : "");
  b.textContent = tag;
  b.onclick = () => {
    if(picked.has(tag)) picked.delete(tag);
    else picked.add(tag);
    paintChips();
    render();
  };
  return b;
}

function paintChips(){
  chipsEl.innerHTML = "";
  buildChips(MOVIES).forEach(tag => chipsEl.appendChild(chipButton(tag)));
}

function tagsFor(movie){
  return Array.isArray(movie.genres) ? movie.genres.map(String) : [];
}

function matchesPicked(movie){
  if(picked.size === 0) return true;
  const tags = new Set(tagsFor(movie));
  for(const p of picked){
    if(!tags.has(p)) return false;
  }
  return true;
}

function matchesQuery(movie, q){
  if(!q) return true;
  const hay = [
    movie.title,
    movie.year,
    movie.meta,
    tagsFor(movie).join(" "),
    movie.summary
  ].join(" ");
  return normalize(hay).includes(q);
}

function getSorted(items){
  return items.slice().sort((a,b)=>{
    const ya = parseInt(String(a.year||"").slice(0,4)) || 0;
    const yb = parseInt(String(b.year||"").slice(0,4)) || 0;
    if(yb !== ya) return yb - ya;
    return String(a.title || "").localeCompare(String(b.title || ""));
  });
}

function setPosterImg(containerEl, url, alt){
  containerEl.classList.remove("zoomed");
  containerEl.innerHTML = "";
  if(url){
    containerEl.classList.remove("fallback");
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = alt || "Poster";
    img.src = url;
    img.onerror = () => {
      containerEl.innerHTML = "";
      containerEl.classList.add("fallback");
    };
    containerEl.appendChild(img);
  }else{
    containerEl.classList.add("fallback");
  }
}

function lockBodyScroll(){
  scrollY = window.scrollY || 0;
  document.body.style.top = `-${scrollY}px`;
  document.body.classList.add("modalOpen");
}

function unlockBodyScroll(){
  document.body.classList.remove("modalOpen");
  const y = Math.abs(parseInt(document.body.style.top || "0", 10)) || 0;
  document.body.style.top = "";
  window.scrollTo(0, y);
}

function openModal(movie){
  setPosterImg(mPoster, movie.poster || "", `${movie.title} poster`);
  mTitle.textContent = movie.title || "Untitled";

  const bits = [];
  if(movie.year) bits.push(movie.year);
  if(movie.meta) bits.push(movie.meta);
  mMeta.textContent = bits.join(" • ");

  mPills.innerHTML = "";
  tagsFor(movie).slice(0, 10).forEach(t=>{
    const p = document.createElement("div");
    p.className = "pill";
    p.textContent = t;
    mPills.appendChild(p);
  });

  mWhy.textContent = movie.summary || "No synopsis added yet.";

  modal.classList.add("on");
  modal.setAttribute("aria-hidden","false");

  lockBodyScroll();
  if(sheetBody) sheetBody.scrollTop = 0;
}

function closeModal(){
  modal.classList.remove("on");
  modal.setAttribute("aria-hidden","true");
  unlockBodyScroll();
}

closeBtn.onclick = closeModal;
modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });
window.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeModal(); });

/* Tap poster to zoom */
mPoster.addEventListener("click", ()=>{
  if(mPoster.classList.contains("fallback")) return;
  mPoster.classList.toggle("zoomed");
});

function card(movie){
  const div = document.createElement("div");
  div.className = "card";

  const posterWrap = document.createElement("div");
  posterWrap.className = "poster" + (movie.poster ? "" : " fallback");

  if(movie.poster){
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = `${movie.title} poster`;
    img.src = movie.poster;
    img.onerror = () => {
      posterWrap.innerHTML = "";
      posterWrap.classList.add("fallback");
    };
    posterWrap.appendChild(img);
  }

  const info = document.createElement("div");
  info.className = "info";

  const tagLine = tagsFor(movie).slice(0, 5).join(" • ");

  info.innerHTML = `
    <div class="title">${movie.title || "Untitled"}</div>
    <div class="meta">${movie.year || ""}${movie.meta ? " • " + movie.meta : ""}</div>
    <div class="tagsline">${tagLine}</div>
  `;

  div.appendChild(posterWrap);
  div.appendChild(info);
  div.onclick = () => openModal(movie);
  return div;
}

function render(){
  const q = normalize(qEl.value);

  const filtered = getSorted(
    MOVIES.filter(m => matchesPicked(m) && matchesQuery(m, q))
  );

  grid.innerHTML = "";
  filtered.forEach(m => grid.appendChild(card(m)));

  resultCount.textContent =
    `${filtered.length} title${filtered.length === 1 ? "" : "s"} found` +
    (picked.size ? ` • Filters: ${[...picked].join(", ")}` : "");

  emptyEl.style.display = filtered.length ? "none" : "block";
}

/* debounce typing */
let t = null;
qEl.addEventListener("input", ()=>{
  clearTimeout(t);
  t = setTimeout(render, 70);
});

clearBtn.onclick = () => { qEl.value = ""; render(); };
clearFiltersBtn.onclick = () => { picked.clear(); paintChips(); render(); };

paintChips();
render();
</script>

</body>
</html>
