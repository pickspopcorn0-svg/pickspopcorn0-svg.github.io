// ============================================================
// SEARCH LOGIC

let activeFilters = new Set();
let allTags = new Set();
let allItems = [];

// DOM elements
const searchInput = document.getElementById('searchInput');
const searchStats = document.getElementById('searchStats');
const filterTags = document.getElementById('filterTags');
const resultsGrid = document.getElementById('resultsGrid');
const noResults = document.getElementById('noResults');

// Initialize
function init() {
  // Combine all items
  allItems = [
    ...SEARCH_INDEX.editorials,
    ...SEARCH_INDEX.essays,
    ...SEARCH_INDEX.categories
  ];
  
  // Extract all unique tags
  allItems.forEach(item => {
    item.tags.forEach(tag => allTags.add(tag));
  });
  
  // Build filter tags
  buildFilterTags();
  
  // Initial render
  render();
  
  // Set up search input listener
  let searchTimeout;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(render, 150);
  });
  
  // Check URL params for initial search
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get('q');
  if (query) {
    searchInput.value = query;
    render();
  }
}

// Build filter tag buttons
function buildFilterTags() {
  // Priority tags in specific order
  const priorityTags = [
    'kdrama', 'cdrama', 'anime', 'donghua',
    'thriller', 'action', 'romance', 'crime', 'espionage',
    'fantasy', 'historical', 'sci-fi',
    'korean', 'chinese', 'japanese', 'french', 'indian', 'global',
    'essay', 'movies', 'tv'
  ];
  
  const tagArray = [...allTags];
  const orderedTags = [
    ...priorityTags.filter(t => tagArray.includes(t)),
    ...tagArray.filter(t => !priorityTags.includes(t)).sort()
  ];
  
  filterTags.innerHTML = orderedTags.map(tag => `
    <div class="filter-tag" data-tag="${tag}">
      ${tag}
    </div>
  `).join('');
  
  // Add click handlers
  filterTags.querySelectorAll('.filter-tag').forEach(tagEl => {
    tagEl.addEventListener('click', () => {
      const tag = tagEl.dataset.tag;
      if (activeFilters.has(tag)) {
        activeFilters.delete(tag);
        tagEl.classList.remove('active');
      } else {
        activeFilters.add(tag);
        tagEl.classList.add('active');
      }
      render();
    });
  });
}

function filterResults(query) {
  const lowerQuery = query.toLowerCase().trim();
  
  return allItems.filter(item => {
    // Filter by active tags
    if (activeFilters.size > 0) {
      const hasAllTags = [...activeFilters].every(tag => 
        item.tags.some(t => t.toLowerCase() === tag.toLowerCase())
      );
      if (!hasAllTags) return false;
    }
    
    // Filter by search query
    if (lowerQuery) {
      const searchableText = [
        item.title,
        item.snippet || '',
        item.type,
        item.category || '',
        item.region || '',
        ...item.tags
      ].join(' ').toLowerCase();
      
      return searchableText.includes(lowerQuery);
    }
    
    return true;
  });
}

// Render results
function render() {
  const query = searchInput.value;
  const results = filterResults(query);
  
  // Update stats
  const totalCount = allItems.length;
  const filterText = activeFilters.size > 0 
    ? ` • Filters: ${[...activeFilters].join(', ')}` 
    : '';
  searchStats.textContent = `${results.length} of ${totalCount} results${filterText}`;
  
  // Update URL
  if (query) {
    const url = new URL(window.location);
    url.searchParams.set('q', query);
    window.history.replaceState({}, '', url);
  } else {
    const url = new URL(window.location);
    url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
  }
  
  // Render cards
  if (results.length === 0) {
    resultsGrid.style.display = 'none';
    noResults.style.display = 'block';
  } else {
    resultsGrid.style.display = 'grid';
    noResults.style.display = 'none';
    
    resultsGrid.innerHTML = results.map(item => createCard(item)).join('');
    
    // Add click handlers
    resultsGrid.querySelectorAll('.result-card').forEach(card => {
      card.addEventListener('click', () => {
        window.location.href = card.dataset.url;
      });
    });
  }
}

// Create result card HTML
function createCard(item) {
  const typeLabel = item.type === 'editorial' ? 'Editorial' 
    : item.type === 'essay' ? 'Essay • Between the Frames' 
    : 'Category';
  
  const categoryText = item.category && item.type !== 'essay' 
    ? ` • ${item.category}` 
    : '';
  
  const regionText = item.region ? ` • ${item.region}` : '';
  
  return `
    <div class="result-card" data-url="${item.url}">
      <div class="result-type">${typeLabel}${categoryText}${regionText}</div>
      <div class="result-title">${item.title}</div>
      ${item.snippet ? `<div class="result-snippet">${item.snippet}</div>` : ''}
      <div class="result-tags">
        ${item.tags.slice(0, 6).map(tag => `<span class="result-tag">${tag}</span>`).join('')}
      </div>
    </div>
  `;
}

// Start the app
init();
</script>
