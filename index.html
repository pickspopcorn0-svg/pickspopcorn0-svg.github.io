<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

body{
  background:#0b0b0c;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

:root{
  --wrap:1200px;
  --sidePad:28px;
  --sectionPad:64px;
  --radius:18px;
  --line:rgba(255,255,255,.12);
  --muted:rgba(255,255,255,.72);
  --muted2:rgba(255,255,255,.58);
}

.container{
  width:min(var(--wrap), calc(100% - var(--sidePad)));
  margin:0 auto;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:66px;
  display:flex;
  align-items:center;
  z-index:100;
  backdrop-filter:blur(16px);
  background:rgba(10,10,14,.82);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.headerInner{
  width:min(var(--wrap), calc(100% - var(--sidePad)));
  margin:0 auto;
}

.logo{
  font-size:15px;
  font-weight:850;
  letter-spacing:.3px;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  padding-top:66px;

  background:
  radial-gradient(900px 500px at 20% 25%, rgba(255,140,70,.14), transparent 60%),
  radial-gradient(900px 560px at 80% 20%, rgba(90,170,255,.14), transparent 60%),
  linear-gradient(to bottom, rgba(0,0,0,.32), rgba(0,0,0,.9)),
  url("assets/home/hero.jpg") center center / cover no-repeat;

  border-bottom:1px solid rgba(255,255,255,.06);
}

.heroInner{
  width:min(var(--wrap), calc(100% - var(--sidePad)));
  margin:0 auto;
  padding:80px 0;
}

.kicker{
  display:inline-flex;
  align-items:center;
  gap:10px;

  padding:10px 14px;
  border-radius:999px;

  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.26);

  font-size:11px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff9a54;
  box-shadow:0 0 18px rgba(255,154,84,.6);
}

.hero h1{
  margin-top:22px;
  font-size:clamp(40px, 5vw, 58px);
  line-height:1.02;
  letter-spacing:-.04em;
  font-weight:900;
  max-width:12ch;
}

.hero p{
  margin-top:18px;
  max-width:62ch;

  color:var(--muted);

  font-size:17px;
  line-height:1.8;
}

.quoteLine{
  display:block;
  margin-top:12px;
  opacity:.9;
}

.heroActions{
  margin-top:30px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:50px;
  padding:15px 24px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);

  font-size:14px;
  font-weight:700;

  transition:.2s ease;
}

.btn.primary{
  background:linear-gradient(90deg,
  rgba(255,160,90,.24),
  rgba(90,170,255,.18));

  border-color:rgba(255,160,90,.44);
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.08);
}

/* SECTIONS */

.section{
  padding:var(--sectionPad) 0;
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:24px;
  margin-bottom:28px;
}

.section h2{
  font-size:30px;
  font-weight:850;
  letter-spacing:-.02em;
}

.sectionLead{
  margin-top:12px;
  max-width:70ch;

  color:var(--muted2);

  font-size:16px;
  line-height:1.75;
}

/* VIEW ALL */

.viewAll{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:46px;
  padding:12px 20px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.04);

  font-size:14px;
  font-weight:800;

  transition:.2s ease;
}

.viewAll:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.08);
}

/* HANDPICKED */

.handpickedTrack{
  display:flex;
  gap:22px;
  overflow-x:auto;
  padding-bottom:10px;
  scrollbar-width:none;
}

.handpickedTrack::-webkit-scrollbar{
  display:none;
}

.pickCard{
  flex:0 0 auto;
  width:170px;
}

.pickCard img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
}

.pickTitle{
  margin-top:12px;
  font-size:14px;
  font-weight:700;
  color:rgba(255,255,255,.86);
}

/* EDITORIAL BOX */

.editorialBox{
  width:min(1100px,100%);
  margin:0 auto 42px;

  padding:34px;

  border-radius:24px;

  background:
  radial-gradient(900px 420px at 15% 10%, rgba(255,160,90,.08), transparent 60%),
  radial-gradient(900px 420px at 85% 10%, rgba(90,170,255,.08), transparent 60%),
  linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.2));

  border:1px solid rgba(255,255,255,.08);
}

.editorialBox h2{
  text-align:center;
}

.editorialBox .sectionLead{
  text-align:center;
  margin:16px auto 0;
}

.editorialBullets{
  margin:22px auto 0;
  max-width:820px;
  list-style:none;
}

.editorialBullets li{
  position:relative;
  margin:12px 0;
  padding-left:20px;

  color:rgba(255,255,255,.64);

  font-size:14px;
  line-height:1.9;
}

.editorialBullets li::before{
  content:"";
  position:absolute;
  left:0;
  top:.9em;

  width:6px;
  height:6px;

  border-radius:50%;
  background:rgba(255,255,255,.34);
}

.editorialCTA{
  margin-top:22px;
  display:flex;
  justify-content:flex-end;
}

/* FEED */

.feed{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.feedCard{
  position:relative;
  overflow:hidden;
  isolation:isolate;

  min-height:280px;

  border-radius:20px;
  border:1px solid rgba(255,255,255,.1);

  background:#111;

  transition:.25s ease;
}

.feedCard:hover{
  transform:translateY(-4px);
}

.feedCard::before{
  content:"";
  position:absolute;
  inset:0;

  background-image:var(--bgimg);
  background-size:cover;
  background-position:center top;

  transform:scale(1.02);
}

.feedCard::after{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(to bottom,
  rgba(0,0,0,.12),
  rgba(0,0,0,.92));
}

.feedText{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:2;

  padding:24px;
}

.feedText h3{
  font-size:20px;
  font-weight:850;
  line-height:1.25;
}

.feedText p{
  margin-top:10px;

  color:rgba(255,255,255,.72);

  font-size:13px;
  line-height:1.7;
}

/* BROWSE CATEGORIES */
/* FIXED ALIGNMENT */

.catGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.cat{
  position:relative;
  overflow:hidden;

  height:220px;

  border-radius:18px;
  border:1px solid rgba(255,255,255,.12);

  background:#111;

  transition:.25s ease;
}

.cat::before{
  content:"";
  position:absolute;
  inset:0;

  background-image:var(--bgimg);
  background-size:cover;
  background-position:center center;

  transform:scale(1.01);
}

.cat::after{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(to top,
  rgba(0,0,0,.9),
  rgba(0,0,0,.35),
  rgba(0,0,0,.08));
}

.cat span{
  position:absolute;
  left:18px;
  bottom:16px;
  z-index:2;

  font-size:20px;
  font-weight:900;

  text-shadow:0 2px 12px rgba(0,0,0,.9);
}

.cat:hover{
  transform:translateY(-3px);
}

/* BETWEEN THE FRAMES */

.btfFeed{
  grid-template-columns:repeat(2,1fr);
}

.btfFeed .feedCard{
  min-height:360px;
}

/* FOOTER */

footer{
  margin-top:20px;
  padding:74px 0 32px;

  border-top:1px solid rgba(255,255,255,.08);

  color:rgba(255,255,255,.66);
}

.footerGrid{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:60px;
}

footer h4{
  margin-bottom:14px;
  color:#fff;
  font-size:14px;
  font-weight:800;
}

footer p,
footer a{
  font-size:13px;
  line-height:1.8;
  color:rgba(255,255,255,.66);
}

footer a{
  display:block;
  margin:8px 0;
}

.footerBottom{
  margin-top:34px;
  padding-top:20px;

  border-top:1px solid rgba(255,255,255,.06);

  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;

  font-size:12px;
  color:rgba(255,255,255,.48);
}

/* MOBILE */

@media (max-width:1024px){

  .feed{
    grid-template-columns:1fr 1fr;
  }

  .catGrid{
    grid-template-columns:1fr 1fr;
  }

  .cat{
    height:180px;
  }

  .btfFeed{
    grid-template-columns:1fr;
  }
}

@media (max-width:768px){

  :root{
    --sidePad:30px;
  }

  .section{
    padding:54px 0;
  }

  .sectionHead{
    flex-direction:column;
    align-items:flex-start;
  }

  .feed{
    grid-template-columns:1fr;
  }

  .feedCard{
    min-height:340px;
  }

  .catGrid{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .cat{
    height:140px;
    border-radius:14px;
  }

  .cat span{
    left:12px;
    bottom:12px;
    font-size:15px;
  }

  .footerGrid{
    grid-template-columns:1fr;
    gap:36px;
  }

  .hero h1{
    max-width:10ch;
  }
}

@media (max-width:520px){

  .pickCard{
    width:140px;
  }

  .editorialBox{
    padding:24px 20px;
  }

  .hero p{
    font-size:16px;
  }
}

</style>

</head>

<header>
  <div class="headerInner">
    <div class="logo">Popcorn Picks</div>
  </div>
</header>
